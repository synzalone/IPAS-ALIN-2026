<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Pintar IPA Kelas 3 SD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@600;800;900&display=swap');

        :root {
            --bg-color: #e0f7fa;
            --card-bg: #ffffff;
            --primary: #ff7043;
            --secondary: #ffe082;
            --text-dark: #37474f;
            --success: #26a69a;
            --danger: #ef5350;
            --info: #29b6f6;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, var(--bg-color), #b2ebf2);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .container {
            background: var(--card-bg);
            width: 95%;
            max-width: 750px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            padding: 30px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: none;
            animation: bounceIn 0.5s ease-out;
            border: 5px solid white;
        }

        .container.active { display: block; }

        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            font-family: 'Comic Neue', cursive;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            font-size: 34px;
            margin-bottom: 5px;
        }

        p.subtitle {
            text-align: center;
            font-size: 16px;
            color: #546e7a;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            border: 3px dashed var(--info);
            border-radius: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus { border-color: var(--primary); background: #fff3e0; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 900;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #d84315;
            font-family: 'Nunito', sans-serif;
        }

        .btn:hover { transform: translateY(2px); box-shadow: 0 4px 0 #d84315; }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #d84315; }
        
        .btn-submit-multi { background: var(--info); box-shadow: 0 6px 0 #0277bd; margin-top: 15px; }
        .btn-submit-multi:hover { box-shadow: 0 4px 0 #0277bd; }
        .btn-submit-multi:active { box-shadow: 0 0 0 #0277bd; }

        .header-info {
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            font-size: 18px;
            color: #78909c;
            border-bottom: 3px dotted #cfd8dc;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .timer-bar {
            width: 100%; height: 16px; background: #eceff1;
            border-radius: 10px; margin-bottom: 20px; overflow: hidden;
        }
        .timer-fill {
            height: 100%; background: var(--success);
            width: 100%; transition: width 1s linear, background 0.5s;
        }

        .question-text {
            font-size: 22px; font-weight: 800;
            margin-bottom: 20px; line-height: 1.5; color: #263238;
        }

        .question-image {
            max-width: 100%; height: auto; max-height: 250px;
            border-radius: 15px; margin: 0 auto 20px auto;
            display: block; border: 4px solid #eceff1;
            object-fit: cover;
        }

        .options-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

        .option-btn {
            background: #f5f5f5; border: 3px solid transparent;
            padding: 15px; font-size: 18px; border-radius: 15px;
            cursor: pointer; transition: 0.2s; font-family: 'Nunito', sans-serif;
            font-weight: 700; text-align: left; color: #37474f;
        }
        .option-btn:hover { background: #fff9c4; border-color: #fbc02d; transform: scale(1.01); }

        .option-label {
            background: #f5f5f5; border: 3px solid transparent;
            padding: 15px; font-size: 18px; border-radius: 15px;
            cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 15px;
        }
        .option-label:hover { background: #fff9c4; border-color: #fbc02d; }
        .option-label input { width: 25px; height: 25px; cursor: pointer; accent-color: var(--primary); }

        .badge-type {
            display: inline-block; background: #ffe082; color: #e65100;
            padding: 6px 16px; border-radius: 20px; font-size: 14px;
            font-weight: 900; margin-bottom: 15px; border: 2px dashed #ffb74d;
        }

        /* Modals */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(38, 50, 56, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }

        .modal-content {
            background: white; padding: 30px; border-radius: 25px;
            text-align: center; max-width: 550px; width: 90%;
            animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 5px solid var(--info);
        }

        @keyframes zoomIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .feedback-title { font-size: 32px; font-weight: 900; margin-bottom: 10px; font-family: 'Comic Neue', cursive; }
        .benar { color: var(--success); }
        .salah { color: var(--danger); }

        .pembahasan-box {
            background: #f5f5f5; border-left: 6px solid var(--info);
            padding: 20px; margin: 20px 0; border-radius: 10px;
            text-align: left; font-size: 18px; font-weight: 700; line-height: 1.5; color: #37474f;
        }

        .score-circle {
            width: 160px; height: 160px;
            background: radial-gradient(circle, var(--success) 0%, #00897b 100%);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 60px; font-weight: 900; color: white;
            margin: 0 auto 20px auto; border: 8px solid white; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <!-- Layar Awal -->
    <div id="start-screen" class="container active">
        <h1>🌱 Petualangan IPA Kelas 3 🌱</h1>
        <p class="subtitle">
            <b>Materi yang diuji:</b> Pancaindra, Metamorfosis Hewan, Lingkungan Biotik & Abiotik, Energi, Menghemat Air, dan Tanaman Singkong.
        </p>
        <input type="text" id="playerName" placeholder="Ketik namamu di sini ya..." autocomplete="off">
        <button class="btn" onclick="startQuiz()">Mulai Belajar!</button>
    </div>

    <!-- Layar Kuis -->
    <div id="quiz-screen" class="container">
        <div class="header-info">
            <span id="player-display">👦👧 Nama</span>
            <span id="question-counter">Soal 1/25</span>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
        <div id="time-text" style="text-align: right; margin-top:-15px; margin-bottom:15px; font-weight:900; color:#78909c;">60 detik</div>
        
        <div id="badge-container"></div>
        <img id="question-image" class="question-image" style="display:none;" src="" alt="Gambar Soal">
        <div class="question-text" id="question-text">Pertanyaan...</div>
        
        <div class="options-grid" id="options-container"></div>
        <button id="btn-submit-multi" class="btn btn-submit-multi" style="display:none;" onclick="checkMultiAnswer()">Kunci Jawaban!</button>
    </div>

    <!-- Layar Selesai -->
    <div id="end-screen" class="container">
        <h1>Kuis Selesai! 🎉</h1>
        <div class="score-circle" id="final-score">100</div>
        <h2 id="final-message" style="color:var(--primary);">Hebat!</h2>
        <button class="btn" onclick="startQuiz()">Kerjakan Ulang (Soal Baru)</button>
    </div>

    <!-- Modal Benar/Salah -->
    <div id="feedback-modal" class="modal-overlay">
        <div class="modal-content" style="border:none; background:transparent; box-shadow:none;">
            <div id="feedback-message" class="feedback-title" style="background:white; padding:35px; border-radius:25px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);"></div>
        </div>
    </div>

    <!-- Modal Pembahasan -->
    <div id="pembahasan-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top:0; color:var(--primary); font-family:'Comic Neue', cursive; font-size: 28px;">💡 Penjelasan Singkat</h2>
            <div class="pembahasan-box" id="pembahasan-text"></div>
            <button class="btn" style="background:var(--success); box-shadow: 0 6px 0 #00897b;" onclick="closePembahasan()">Mengerti 👍</button>
            <div style="font-size: 15px; color: #78909c; margin-top: 15px; font-weight:700;" id="pembahasan-timer-text">Otomatis lanjut dalam 60 detik...</div>
        </div>
    </div>

    <script>
        // Bank Soal: 33 Soal Mencakup Seluruh Materi
        const bankSoal = [
            // MATERI 1 & 2: PANCAINDRA, KEBIASAAN, & DAUN TELINGA
            { type: "pg", q: "Indra peraba yang membuat kita bisa merasakan panas, dingin, halus, dan kasar adalah...", options: ["Lidah", "Hidung", "Kulit", "Mata"], answer: 2, exp: "Kulit adalah indra peraba yang sangat peka terhadap sentuhan dan suhu di sekitar kita." },
            { type: "multi", q: "Manakah di bawah ini yang merupakan bagian dari 5 Pancaindra manusia?", options: ["Mata", "Jantung", "Telinga", "Lidah", "Lambung"], answer: [0, 2, 3], exp: "Pancaindra (5 indra) manusia terdiri dari: Mata, Telinga, Hidung, Lidah, dan Kulit." },
            { type: "image_pg", img: "https://cdn.pixabay.com/photo/2013/07/12/13/21/ear-146903_960_720.png", q: "Perhatikan gambar alat indra pendengaran di atas! Apa fungsi utama dari bagian luar (daun telinga)?", options: ["Mengeluarkan kotoran telinga", "Menjaga keseimbangan tubuh saat berjalan", "Mengumpulkan gelombang suara agar masuk ke dalam", "Mendengar suara perut"], answer: 2, exp: "Bentuk daun telinga yang melebar berfungsi seperti corong untuk menangkap dan mengumpulkan gelombang suara menuju lubang telinga." },
            { type: "pg", q: "Kebiasaan yang benar untuk menjaga kesehatan mata saat membaca buku adalah...", options: ["Membaca sambil tiduran", "Membaca di tempat yang redup / gelap", "Membaca di tempat yang terang", "Mendekatkan buku sangat dekat dengan wajah"], answer: 2, exp: "Membaca di tempat yang terang membantu mata agar tidak cepat lelah dan terhindar dari kerusakan." },
            { type: "bs", q: "Benar atau Salah: Mendengarkan musik dengan volume yang sangat keras memakai headset adalah kebiasaan yang baik untuk indra pendengar.", options: ["Benar", "Salah"], answer: 1, exp: "Salah! Suara yang terlalu keras dapat merusak gendang telinga secara permanen." },
            { type: "pg", q: "Fungsi dari rambut-rambut halus dan selaput lendir di dalam hidung kita adalah...", options: ["Menyaring debu dan kotoran agar tidak masuk ke paru-paru", "Memperindah bentuk hidung", "Untuk mencium berbagai aroma masakan", "Agar udara cepat keluar"], answer: 0, exp: "Rambut hidung menyaring udara kotor yang masuk, sehingga udara yang menuju paru-paru menjadi bersih." },
            { type: "multi", q: "Cara merawat kebersihan dan kesehatan kulit (indra peraba) adalah...", options: ["Mandi dua kali sehari menggunakan sabun", "Berjemur seharian di bawah matahari terik", "Mengganti pakaian yang kotor dengan pakaian bersih", "Menggosok kulit dengan sikat kawat"], answer: [0, 2], exp: "Kulit harus dijaga dengan mandi teratur dan memakai pakaian yang bersih agar terhindar dari penyakit jamur." },

            // MATERI 3 & 4: SIKLUS HIDUP KATAK & KUPU-KUPU, METAMORFOSIS
            { type: "image_pg", img: "https://cdn.pixabay.com/photo/2017/02/08/17/24/butterfly-2049567_960_720.jpg", q: "Kupu-kupu pada gambar mengalami metamorfosis sempurna. Urutan daur hidupnya yang benar adalah...", options: ["Telur -> Kepompong -> Ulat -> Kupu-kupu", "Telur -> Ulat -> Kepompong -> Kupu-kupu", "Ulat -> Telur -> Kupu-kupu -> Kepompong", "Kepompong -> Ulat -> Telur -> Kupu-kupu"], answer: 1, exp: "Kupu-kupu berkembang biak mulai dari Telur menetas jadi Ulat (larva), lalu berdiam diri jadi Kepompong (pupa), hingga menetas jadi Kupu-kupu." },
            { type: "image_pg", img: "https://cdn.pixabay.com/photo/2014/04/03/11/56/frog-312645_960_720.png", q: "Perhatikan daur hidup katak di atas! Setelah telur menetas, katak akan hidup di air dan bernapas dengan insang. Fase ini disebut...", options: ["Kepompong", "Katak Muda", "Berudu / Kecebong", "Katak Dewasa"], answer: 2, exp: "Berudu (kecebong) adalah anak katak yang masih hidup seperti ikan di air dan bernapas menggunakan insang." },
            { type: "pg", q: "Hewan yang bentuk tubuh anak dan induknya sangat berbeda serta harus melalui tahap pupa (kepompong) disebut mengalami metamorfosis...", options: ["Tidak sempurna", "Sempurna", "Setengah sempurna", "Tidak bermetamorfosis"], answer: 1, exp: "Metamorfosis Sempurna ditandai dengan perubahan bentuk tubuh yang sangat nyata, seperti melalui tahap kepompong." },
            { type: "bs", q: "Benar atau Salah: Kecoa dan belalang adalah contoh hewan yang mengalami metamorfosis tidak sempurna karena tidak melewati fase kepompong.", options: ["Benar", "Salah"], answer: 0, exp: "Benar. Metamorfosis tidak sempurna hanya melalui fase: Telur -> Nimfa (Hewan Muda) -> Hewan Dewasa." },
            { type: "multi", q: "Hewan di bawah ini yang mengalami metamorfosis sempurna adalah...", options: ["Kupu-kupu", "Ayam", "Nyamuk", "Kucing", "Lalat"], answer: [0, 2, 4], exp: "Kupu-kupu, Nyamuk, dan Lalat adalah contoh serangga dengan metamorfosis sempurna." },
            { type: "pg", q: "Pada daur hidup kupu-kupu, tahap yang paling merugikan bagi petani karena banyak memakan daun tanaman adalah...", options: ["Telur", "Ulat (Larva)", "Kepompong (Pupa)", "Kupu-kupu dewasa"], answer: 1, exp: "Ulat sangat rakus memakan dedaunan agar memiliki cukup energi untuk berubah menjadi kepompong." },
            { type: "pg", q: "Katak dewasa bernapas menggunakan paru-paru dan...", options: ["Insang", "Sirip", "Kulit yang basah", "Trakea"], answer: 2, exp: "Katak dewasa bernapas dengan paru-paru dan dibantu oleh kulitnya yang selalu lembab." },

            // MATERI 5 & 6: BIOTIK & ABIOTIK, SUMBER ENERGI TERBESAR
            { type: "pg", q: "Dalam lingkungan alam, manusia, hewan, dan tumbuhan digolongkan sebagai komponen...", options: ["Biotik", "Abiotik", "Atmosfer", "Buatan"], answer: 0, exp: "Biotik berasal dari kata 'Bio' yang artinya hidup. Jadi komponen biotik adalah semua benda hidup." },
            { type: "multi", q: "Berikut ini yang merupakan contoh dari komponen abiotik (benda tak hidup) di alam adalah...", options: ["Batu", "Air", "Pohon Mangga", "Udara / Angin", "Kambing"], answer: [0, 1, 3], exp: "Komponen abiotik meliputi benda mati yang penting bagi kehidupan seperti air, udara, tanah, dan cahaya." },
            { type: "bs", q: "Benar atau Salah: Tumbuhan merupakan komponen biotik yang sangat bergantung pada komponen abiotik seperti air dan sinar matahari.", options: ["Benar", "Salah"], answer: 0, exp: "Benar. Tumbuhan (hidup/biotik) butuh air dan matahari (tak hidup/abiotik) untuk proses fotosintesis." },
            { type: "image_pg", img: "https://cdn.pixabay.com/photo/2012/04/18/19/21/sun-37651_960_720.png", q: "Gambar di atas menunjukkan sumber energi panas dan cahaya abiotik terbesar di bumi, yaitu...", options: ["Bulan", "Gunung Berapi", "Matahari", "Listrik"], answer: 2, exp: "Matahari adalah pusat tata surya dan sumber energi terbesar dan terpenting bagi seluruh makhluk di bumi." },
            { type: "pg", q: "Cahaya matahari membantu tumbuhan hijau untuk memasak makanannya sendiri. Proses ini disebut...", options: ["Metamorfosis", "Respirasi", "Fotosintesis", "Penyerbukan"], answer: 2, exp: "Fotosintesis adalah cara tumbuhan membuat makanan dengan bantuan air, karbon dioksida, dan cahaya matahari." },

            // MATERI 7 & 8: LESTARIKAN LINGKUNGAN DAN HEMAT AIR
            { type: "pg", q: "Cara mudah melestarikan lingkungan agar sekolah tidak banjir saat hujan turun adalah...", options: ["Membuang sampah ke selokan", "Membuang sampah pada tempatnya", "Menebang semua pohon di taman", "Membakar daun kering"], answer: 1, exp: "Membuang sampah sembarangan akan menyumbat saluran air, yang menjadi penyebab utama banjir." },
            { type: "bs", q: "Benar atau Salah: Menanam pohon kembali di hutan yang sudah gundul disebut Reboisasi dan sangat berguna mencegah tanah longsor.", options: ["Benar", "Salah"], answer: 0, exp: "Benar! Akar pohon akan menahan tanah dan menyerap air hujan." },
            { type: "multi", q: "Tindakan yang tepat untuk menghemat penggunaan air bersih di rumah adalah...", options: ["Membiarkan keran air bak mandi meluber", "Mematikan keran air saat sedang menyikat gigi", "Menyiram tanaman secukupnya saja", "Mencuci piring di air yang mengalir terus menerus"], answer: [1, 2], exp: "Air bersih harus dijaga. Menutup keran jika tidak dipakai akan sangat menghemat persediaan air bumi." },
            { type: "pg", q: "Kawasan hutan yang dikhususkan oleh pemerintah untuk melindungi hewan dan tumbuhan yang hampir punah disebut...", options: ["Cagar alam / Suaka margasatwa", "Kebun Binatang", "Taman Kota", "Hutan Produksi"], answer: 0, exp: "Cagar alam dan suaka margasatwa adalah tempat perlindungan makhluk hidup agar tidak punah dari bumi." },
            { type: "pg", q: "Kita dapat menghemat air dengan cara memanfaatkan air bekas cucian beras untuk...", options: ["Mencuci baju", "Dimasak kembali menjadi minuman", "Menyiram tanaman di halaman", "Mencuci mobil"], answer: 2, exp: "Air cucian beras mengandung banyak nutrisi yang baik untuk menyuburkan tanah tanaman." },

            // MATERI 9: PERKEMBANGBIAKAN SINGKONG
            { type: "image_pg", img: "https://images.pexels.com/photos/5945823/pexels-photo-5945823.jpeg?auto=compress&cs=tinysrgb&w=600", q: "Perhatikan gambar singkong di atas! Tanaman singkong menyimpan cadangan makanannya di bagian...", options: ["Bunga", "Daun", "Umbi Akar (di dalam tanah)", "Batang"], answer: 2, exp: "Singkong menyimpan karbohidrat sebagai cadangan makanan di bagian akarnya, yang membesar menjadi umbi." },
            { type: "pg", q: "Cara paling umum dilakukan petani untuk mengembangbiakkan (menanam) singkong adalah dengan cara...", options: ["Menanam bijinya", "Stek batang (menancapkan potongan batang ke tanah)", "Mencangkok daun", "Menanam bunganya"], answer: 1, exp: "Singkong sangat mudah ditumbuhkan dengan teknik stek batang. Cukup potong batangnya lalu tancapkan di tanah." },
            { type: "bs", q: "Benar atau Salah: Daun pada tanaman singkong sama sekali tidak bisa dimakan oleh manusia.", options: ["Benar", "Salah"], answer: 1, exp: "Salah! Pucuk daun singkong justru sangat lezat dan sering dimasak menjadi sayur oleh masyarakat Indonesia." },

            // TAMBAHAN ACAK UNTUK VARIASI
            { type: "pg", q: "Selain Matahari, salah satu contoh komponen abiotik yang kita hirup setiap saat untuk bernapas adalah...", options: ["Udara (Oksigen)", "Cahaya", "Air", "Batu"], answer: 0, exp: "Oksigen di udara adalah komponen abiotik mutlak yang dibutuhkan manusia dan hewan untuk hidup." },
            { type: "multi", q: "Hewan berikut ini yang TIDAK mengalami proses metamorfosis (bentuk anak sama dengan induknya) adalah...", options: ["Sapi", "Katak", "Kupu-kupu", "Kucing", "Kambing"], answer: [0, 3, 4], exp: "Sapi, kucing, dan kambing berkembang biak dengan melahirkan dan bentuk anaknya sama persis dengan induknya (hanya berbeda ukuran)." },
            { type: "pg", q: "Tindakan manusia membuang limbah pabrik atau deterjen ke sungai dapat merusak komponen biotik, yaitu...", options: ["Udara menjadi segar", "Batu sungai menjadi besar", "Ikan-ikan di sungai akan mati keracunan", "Jembatan menjadi rusak"], answer: 2, exp: "Air sungai yang tercemar bahan kimia (deterjen/limbah) sangat beracun bagi komponen biotik yang hidup di dalamnya, seperti ikan." },
            { type: "bs", q: "Benar atau Salah: Menggunakan air keran selang untuk menyapu sampah daun di halaman adalah tindakan hemat air.", options: ["Benar", "Salah"], answer: 1, exp: "Salah! Membersihkan halaman dengan menyemprotkan air sangat boros. Gunakanlah sapu lidi." },
            { type: "pg", q: "Kupu-kupu sering hinggap dari satu bunga ke bunga lainnya. Hal ini secara tidak langsung membantu tumbuhan dalam proses...", options: ["Fotosintesis", "Penyerbukan (Perkembangbiakan)", "Mencari air", "Menggugurkan daun"], answer: 1, exp: "Saat kupu-kupu mencari nektar, serbuk sari bunga akan menempel di badannya dan terbawa ke bunga lain sehingga terjadi penyerbukan." },
            { type: "multi", q: "Bagian tubuh tanaman singkong yang bisa dimanfaatkan manusia sebagai sumber makanan adalah...", options: ["Umbi akarnya (Singkong)", "Batang kayunya", "Daun pucuknya", "Bunga beracunnya"], answer: [0, 2], exp: "Umbi singkong bisa direbus atau digoreng, dan daunnya sangat sehat untuk dimasak menjadi sayur." }
        ];

        let userName = "";
        let selectedQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let totalQuestions = 25;
        
        let timerInterval;
        let timeLeft = 60;
        let pembInterval;
        let pembTimeLeft = 60;

        // Mendefinisikan Elemen HTML
        const screens = {
            start: document.getElementById('start-screen'),
            quiz: document.getElementById('quiz-screen'),
            end: document.getElementById('end-screen')
        };
        const els = {
            nameInput: document.getElementById('playerName'),
            playerDisplay: document.getElementById('player-display'),
            counter: document.getElementById('question-counter'),
            qText: document.getElementById('question-text'),
            qImg: document.getElementById('question-image'),
            optionsBox: document.getElementById('options-container'),
            badgeCont: document.getElementById('badge-container'),
            timerFill: document.getElementById('timer-fill'),
            timeText: document.getElementById('time-text'),
            btnMulti: document.getElementById('btn-submit-multi'),
            fbModal: document.getElementById('feedback-modal'),
            fbMsg: document.getElementById('feedback-message'),
            pembModal: document.getElementById('pembahasan-modal'),
            pembText: document.getElementById('pembahasan-text'),
            pembTimer: document.getElementById('pembahasan-timer-text'),
            fScore: document.getElementById('final-score'),
            fMsg: document.getElementById('final-message')
        };

        // Fungsi Pengacak Array (Fisher-Yates)
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Fungsi Memulai Kuis
        function startQuiz() {
            let input = els.nameInput.value.trim();
            if(!input && !userName) {
                alert("Hei, isi namamu dulu ya agar permainannya makin seru!");
                return;
            }
            if(input) userName = input;

            els.playerDisplay.innerText = "⭐ " + userName;
            
            // Pilih acak 25 soal dari total 33 bank soal
            selectedQuestions = shuffle(bankSoal).slice(0, totalQuestions);
            currentIndex = 0;
            score = 0;

            switchScreen('quiz');
            loadQuestion();
        }

        // Fungsi Pindah Layar
        function switchScreen(screenId) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[screenId].classList.add('active');
        }

        // Fungsi Memuat Soal Saat Ini
        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 60;
            updateTimerUI();
            els.btnMulti.style.display = 'none';
            els.qImg.style.display = 'none';
            
            let q = selectedQuestions[currentIndex];
            els.counter.innerText = `Soal ${currentIndex + 1} dari ${totalQuestions}`;
            els.qText.innerText = q.q;

            // Memuat Gambar jika Tipe Soal bergambar
            if(q.type === 'image_pg' && q.img) {
                els.qImg.src = q.img;
                els.qImg.style.display = 'block';
            }

            // Memuat Label Kategori Soal
            let typeText = q.type === 'multi' ? "Pilih Jawaban Lebih Dari Satu!" : (q.type === 'bs' ? "Pilih Benar atau Salah!" : "Pilihan Ganda");
            els.badgeCont.innerHTML = `<span class="badge-type">${typeText}</span>`;

            // Memuat Pilihan Jawaban
            els.optionsBox.innerHTML = "";
            
            if(q.type === 'pg' || q.type === 'image_pg') {
                let opts = shuffle(q.options.map((opt, i) => ({text: opt, idx: i})));
                opts.forEach(opt => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.text;
                    btn.onclick = () => checkAnswerPG(opt.idx);
                    els.optionsBox.appendChild(btn);
                });
            } else if(q.type === 'bs') {
                q.options.forEach((opt, i) => {
                    let btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.style.textAlign = 'center';
                    btn.style.fontSize = '22px';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswerPG(i);
                    els.optionsBox.appendChild(btn);
                });
            } else if(q.type === 'multi') {
                q.options.forEach((opt, i) => {
                    let lbl = document.createElement('label');
                    lbl.className = 'option-label';
                    lbl.innerHTML = `<input type="checkbox" value="${i}"> ${opt}`;
                    els.optionsBox.appendChild(lbl);
                });
                els.btnMulti.style.display = 'block';
            }

            // Memulai Timer Soal
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function updateTimerUI() {
            let pct = (timeLeft / 60) * 100;
            els.timerFill.style.width = pct + "%";
            els.timeText.innerText = timeLeft + " detik";
            
            if(timeLeft <= 10) {
                els.timerFill.style.background = "var(--danger)";
                els.timeText.style.color = "var(--danger)";
            } else {
                els.timerFill.style.background = "var(--success)";
                els.timeText.style.color = "#78909c";
            }
        }

        function disableInputs() {
            let btns = els.optionsBox.querySelectorAll('button, input');
            btns.forEach(b => b.disabled = true);
            els.btnMulti.disabled = true;
        }

        // Cek Jawaban Pilihan Ganda & Benar/Salah
        function checkAnswerPG(selectedIdx) {
            clearInterval(timerInterval);
            disableInputs();
            let isCorrect = selectedIdx === selectedQuestions[currentIndex].answer;
            if(isCorrect) score++;
            showFeedback(isCorrect);
        }

        // Cek Jawaban Multiple Choice Checkbox
        function checkMultiAnswer() {
            clearInterval(timerInterval);
            disableInputs();
            let checkboxes = els.optionsBox.querySelectorAll('input[type="checkbox"]');
            let selected = [];
            checkboxes.forEach(cb => { if(cb.checked) selected.push(parseInt(cb.value)); });
            
            let correctArr = selectedQuestions[currentIndex].answer;
            
            // Cek apakah jumlah jawaban sama dan isinya identik
            let isCorrect = selected.length === correctArr.length && selected.every(val => correctArr.includes(val));
            
            if(isCorrect) score++;
            showFeedback(isCorrect);
        }

        function handleTimeout() {
            disableInputs();
            showFeedback(false, true);
        }

        // Menampilkan Pop-Up Benar atau Salah
        function showFeedback(isCorrect, isTimeout = false) {
            els.fbModal.style.display = 'flex';
            if(isCorrect) {
                els.fbMsg.innerHTML = `<span class="benar">🎉 ${userName} kamu Hebat!</span>`;
            } else {
                let msg = isTimeout ? `⏰ Yah, waktu habis!` : `💪 Coba Lagi ya, ${userName}!`;
                els.fbMsg.innerHTML = `<span class="salah">${msg}</span>`;
            }
            
            // Lanjut ke Pembahasan setelah 1.5 detik
            setTimeout(() => {
                els.fbModal.style.display = 'none';
                showPembahasan();
            }, 1500);
        }

        // Menampilkan Pop-Up Pembahasan
        function showPembahasan() {
            els.pembModal.style.display = 'flex';
            els.pembText.innerText = selectedQuestions[currentIndex].exp;
            
            pembTimeLeft = 60;
            els.pembTimer.innerText = `Otomatis lanjut dalam ${pembTimeLeft} detik...`;
            
            pembInterval = setInterval(() => {
                pembTimeLeft--;
                els.pembTimer.innerText = `Otomatis lanjut dalam ${pembTimeLeft} detik...`;
                if(pembTimeLeft <= 0) closePembahasan();
            }, 1000);
        }

        // Menutup Pembahasan & Melanjutkan ke Soal Berikutnya
        function closePembahasan() {
            clearInterval(pembInterval);
            els.pembModal.style.display = 'none';
            els.btnMulti.disabled = false;
            currentIndex++;
            if(currentIndex < totalQuestions) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // Menampilkan Hasil Akhir
        function showResult() {
            switchScreen('end');
            let finalVal = Math.round((score / totalQuestions) * 100);
            els.fScore.innerText = finalVal;
            
            if(finalVal >= 90) els.fMsg.innerText = `Luar Biasa, ${userName}! Kamu sangat cerdas! 🏆`;
            else if(finalVal >= 75) els.fMsg.innerText = `Kerja Bagus, ${userName}! Yuk, tingkatkan lagi! 🌟`;
            else els.fMsg.innerText = `Tetap Semangat, ${userName}! Jangan pernah menyerah! 💪`;
        }
    </script>
</body>
</html>
